# ============================================================
# StaffDeck 本地开发环境（PostgreSQL 数据库）
#
# 用途：在本地启动一个 PostgreSQL 容器，供后端开发调试使用。
# 不包含应用本身（后端直接在宿主机用 uvicorn 跑）。
#
# 用法：
#   docker compose up -d        # 后台启动 PG
#   docker compose down         # 停止 PG（保留数据）
#   docker compose down -v      # 停止 PG 并删除所有数据（重置）
# ============================================================

services:
  postgres:
    # 使用 PostgreSQL 16 轻量镜像（alpine 版本体积更小）
    image: postgres:16-alpine
    container_name: staffdeck-postgres

    # 端口映射：宿主机 5432 → 容器 5432
    # 如果本地已有其他 PG 占用 5432，可改为 "5433:5432"
    ports:
      - "5432:5432"

    # 环境变量：初始化数据库的用户/密码/库名
    # 这些值必须与 backend/.env 的 DATABASE_URL 保持一致
    environment:
      POSTGRES_USER: staffdeck
      POSTGRES_PASSWORD: staffdeck123
      POSTGRES_DB: staffdeck

    # 数据卷：持久化 PG 数据，重启容器不丢数据
    # 数据存在 Docker 的 named volume "staffdeck-pg-data" 中
    volumes:
      - staffdeck-pg-data:/var/lib/postgresql/data

    # 健康检查：每 5 秒探测一次 PG 是否就绪
    # 后端依赖 DATABASE_URL 连接，PG 未就绪时后端会启动失败
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffdeck -d staffdeck"]
      interval: 5s
      timeout: 3s
      retries: 10

    # 总是重启（除非手动停止）
    restart: unless-stopped

# 命名数据卷声明
volumes:
  staffdeck-pg-data:
    driver: local
